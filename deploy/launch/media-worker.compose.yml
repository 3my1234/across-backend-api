# REVIEW ONLY. No host resources are created by preparing this file.
services:
  media-worker:
    image: ${ATL_RELEASE_IMAGE:?Use the reviewed immutable release image}
    command: [/app/across-worker]
    env_file: ["${ATL_MEDIA_ENV_FILE:?Use a reviewed private environment file}"]
    environment:
      APP_ENV: production
      WORKER_ROLES: media
      ASYNC_VIDEO_PROCESSING: "true"
      RUN_INLINE_WORKERS: "false"
      RUN_MIGRATIONS: "false"
      DB_MAX_CONNS: "2"
      DB_MIN_CONNS: "0"
      DATABASE_READ_URL: ""
    cpus: 0.5
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 64
    read_only: true
    user: "10001:10001"
    tmpfs: ["/tmp:size=192m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: on-failure
    stop_grace_period: 20s
    networks: [application]
networks:
  application:
    external: true
    name: ${ATL_APP_NETWORK:?Existing private application network}
