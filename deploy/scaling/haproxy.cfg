global
  log stdout format raw local0
  maxconn 1024

defaults
  log global
  mode http
  option httplog
  timeout connect 3s
  timeout client 65s
  timeout server 65s
  timeout queue 2s
  # Do not retry failed POSTs or redispatch writes to another replica.
  retries 0

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 2s

frontend api
  bind :8080
  default_backend replicas

backend replicas
  balance leastconn
  # Loopback pilot only: identifies which replica answered a readiness probe.
  http-response set-header X-Atl-Pilot-Backend %[srv_name]
  option httpchk
  http-check send meth GET uri /api/v1/ready ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server inter 2s fall 2 rise 2
  # Capacity ceiling, not four running instances. Start with --scale api=2.
  # Docker DNS discovers replicas without IP pinning or sticky sessions.
  server-template api 4 api:8080 check resolvers docker init-addr none maxconn 64
