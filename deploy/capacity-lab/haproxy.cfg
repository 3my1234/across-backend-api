global
  maxconn 512
defaults
  mode http
  timeout connect 2s
  timeout client 15s
  timeout server 15s
frontend lab
  bind :8080
  option forwardfor
  default_backend apis
backend apis
  balance leastconn
  option httpchk GET /api/v1/health
  http-response set-header X-Lab-Backend %[srv_name]
  http-response set-header X-Atl-Capacity-Lab disposable-compose-only
  server api1 api1:8080 check inter 1s
  server api2 api2:8080 check inter 1s
