# Template only: do not install or copy onto the existing Coolify/DB hosts.
# One unique node-name and node-ip per NEW server. First init and subsequent join
# settings must be selected separately after operator review; no installer here.
node-name: REPLACE_NEW_SERVER_NAME
node-ip: REPLACE_NEW_SERVER_PRIVATE_IP
advertise-address: REPLACE_NEW_SERVER_PRIVATE_IP
tls-san:
  - REPLACE_PRIVATE_REGISTRATION_ENDPOINT
write-kubeconfig-mode: "0600"
secrets-encryption: true
flannel-backend: wireguard-native
cluster-cidr: REPLACE_NONCONFLICTING_POD_CIDR
service-cidr: REPLACE_NONCONFLICTING_SERVICE_CIDR
cluster-dns: REPLACE_CLUSTER_DNS_IP
# Retain ingress components consistently across all three servers; validate
# chosen Traefik/CNI versions and actual private-node firewall paths first.
etcd-snapshot-schedule-cron: "0 */6 * * *"
etcd-snapshot-retention: 12
# Off-node etcd snapshots + protected join token must be designed separately.
