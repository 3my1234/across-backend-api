name: Single-host disposable rehearsal
run-name: ${{ inputs.execute && format('Single-host trial {0}', inputs.run_nonce) || 'Single-host disposable rehearsal' }}
on:
  push:
    branches: [experiment/single-host-qualification]
    paths: [deploy/singlehost-lab/**, .github/workflows/singlehost-rehearsal.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: 'Live single-host placement requires separate explicit approval. Default is disposable only.'
        type: boolean
        default: false
      run_nonce:
        description: 'Exact separately reviewed live nonce'
        type: string
        default: ''
      plan_only:
        description: 'Offline authorization/workload checks only; no Docker or SSH'
        type: boolean
        default: false
      network_only:
        description: 'Disposable private bridge connectivity only; no seed or live hosts'
        type: boolean
        default: false
      snapshot_build:
        description: 'Build full500-pair synthetic dump; rehearse atomic restore and unchanged smoke'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: singlehost-disposable-rehearsal
  cancel-in-progress: false
jobs:
  rehearsal:
    if: ${{ !inputs.execute && !inputs.plan_only && !inputs.network_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate renderer and unchanged application source
        run: |
          npm install --prefix /tmp/singlehost-tools --ignore-scripts --no-audit --no-fund yaml@2.9.0
          NODE_PATH=/tmp/singlehost-tools/node_modules node deploy/singlehost-lab/test-render.cjs
          python3 -m py_compile deploy/singlehost-lab/*.py
          python3 -m unittest discover -s deploy/singlehost-lab -p 'test_*.py' -v
          python3 -m unittest discover -s deploy/cohost-lab -p 'test_baseline_dns.py' -v
          python3 -m unittest discover -s deploy/cohost-lab -p 'test_backend_health_scope.py' -v
          python3 deploy/singlehost-lab/provenance.py
          python3 deploy/singlehost-lab/check_seed.py
      - name: Build actual unchanged API and seed tools on free CI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          docker build -f deploy/capacity-lab/Dockerfile -t atlxpres-singlehost-rehearsal:local .
          docker run --rm -v "$PWD:/src:ro" -w /src golang:1.27.3-alpine3.23 sh -c 'go test -buildvcs=false ./cmd/capacity-lab -run TestRecipientShards -count=1'
          docker pull postgres:16-alpine
          docker pull redis:7.2-alpine
          docker pull haproxy:3.0-alpine
          docker pull grafana/k6:2.3.0
      - name: Rehearse actual20-session foundation using retained500-pair seed proof
        env:
          NODE_PATH: /tmp/singlehost-tools/node_modules
          SNAPSHOT_BUILD: ${{ inputs.snapshot_build }}
        run: |
          if [ "$SNAPSHOT_BUILD" = true ]; then
            sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,NODE_PATH python3 deploy/singlehost-lab/rehearse.py --snapshot-build
          else
            sudo --preserve-env=GITHUB_ACTIONS,NODE_PATH python3 deploy/singlehost-lab/rehearse.py --foundation
          fi
      - name: Retain result in logs without depending on artifact downloads
        if: always()
        run: |
          if [ -f singlehost-rehearsal-evidence/result.json ]; then cat singlehost-rehearsal-evidence/result.json; fi
          if [ -f singlehost-rehearsal-evidence/seed.log ]; then tail -n 12 singlehost-rehearsal-evidence/seed.log; fi
          if [ -f singlehost-rehearsal-evidence/k6.log ]; then tail -n 15 singlehost-rehearsal-evidence/k6.log; fi
          if [ -f singlehost-rehearsal-evidence/reconciliation.jsonl ]; then tail -n 5 singlehost-rehearsal-evidence/reconciliation.jsonl; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singlehost-rehearsal-${{ github.run_id }}
          path: singlehost-rehearsal-evidence/
          retention-days: 7
          if-no-files-found: warn
  plan:
    if: ${{ inputs.plan_only && !inputs.execute }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest discover -s deploy/cohost-lab -p 'test_backend_health_scope.py' -v
          python3 -m unittest discover -s deploy/singlehost-lab -p 'test_*.py' -v
          python3 deploy/singlehost-lab/runner.py
          pwsh -NoProfile -Command '$errors=$null; $tokens=$null; [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "deploy/singlehost-lab/operator.ps1"),[ref]$tokens,[ref]$errors) | Out-Null; if ($errors.Count) { $errors; exit 1 }'
  network:
    if: ${{ inputs.network_only && !inputs.execute }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker pull redis:7.2-alpine
          python3 deploy/singlehost-lab/rehearse_network.py
  qualification:
    if: ${{ inputs.execute }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify explicit placement approval and exact passed rehearsal before SSH
        env:
          GH_TOKEN: ${{ github.token }}
          SINGLEHOST_TRIAL_BUNDLE: ${{ secrets.SINGLEHOST_TRIAL_BUNDLE }}
          EXPECTED_NONCE: ${{ inputs.run_nonce }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,sys
          sys.path.insert(0,'deploy/singlehost-lab')
          from policy import validate
          a=validate(json.loads(os.environ['SINGLEHOST_TRIAL_BUNDLE'])['approval'])
          assert a['run']==os.environ['EXPECTED_NONCE']
          assert a['source_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert str(a['rehearsal_run']).isdigit()
          evidence=json.loads(subprocess.check_output(['gh','run','view',str(a['rehearsal_run']),'--json','status,conclusion,headSha,jobs']))
          assert evidence['status']=='completed' and evidence['conclusion']=='success' and evidence['headSha']==a['source_commit']
          assert len([j for j in evidence['jobs'] if j['name']=='rehearsal' and j['status']=='completed' and j['conclusion']=='success'])==1
          PY
          python3 deploy/cohost-lab/check_generator.py deploy/cohost-lab/proofs/generator-42178904513
          docker pull grafana/k6:2.3.0
          python3 deploy/singlehost-lab/install_ci.py .singlehost-private
      - name: Execute only the approved original staged workload
        run: python3 deploy/singlehost-lab/runner.py --execute --approval .singlehost-private/approval.json --ssh-config .singlehost-private/ssh_config --output singlehost-evidence
      - name: Attempt test-only cleanup even if the coordinator was interrupted
        if: always()
        run: |
          if [ -f .singlehost-private/ssh_config ]; then
            timeout 180s ssh -F .singlehost-private/ssh_config cohost-main cleanup
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singlehost-trial-${{ github.run_id }}
          path: singlehost-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove runner-local restricted credentials and bearer fixtures
        if: always()
        run: |
          python3 deploy/singlehost-lab/install_ci.py --cleanup .singlehost-private
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path.cwd().resolve()
          for path in [root/'.singlehost-private',*root.glob('private-cohost-*')]:
            assert path.parent==root
            if path.exists():shutil.rmtree(path)
          PY
