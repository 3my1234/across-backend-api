name: Linux Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.worker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Check worker health and heartbeat concurrency
        run: CGO_ENABLED=1 go test -race ./cmd/worker ./internal/workers
      - name: Build production image
        run: docker build --progress=plain --file ${{ matrix.dockerfile }} --tag across-backend:ci .
