name: Linux Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  aws-template-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.57.2
      - run: python deploy/aws/test_safety.py
      - run: cfn-lint deploy/aws/foundation.json deploy/aws/application.json
  provider-policy-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-provider-tests
          POSTGRES_DB: provider_tests
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Verify contact-only checkout, permanent Free capacity and paid discovery
        env:
          DATABASE_URL: postgres://postgres:ci-provider-tests@127.0.0.1:5432/provider_tests?sslmode=disable
          SETTLEMENT_TEST_LOCAL: 'true'
        run: go test ./internal/controllers -count=1 -run 'Test(ProductRecommendations|ProductCheckoutDisabled|ProductChat|ProviderIdentity|ProviderBrand|ProviderMedia|Driver|ServiceSearch|PaidDiscovery|Community|TownHall)'
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.worker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Check worker health and heartbeat concurrency
        run: CGO_ENABLED=1 go test -race ./cmd/worker ./internal/workers
      - name: Check API admission and connection budget
        run: |
          CGO_ENABLED=1 go test -race ./internal/middleware ./internal/config ./cmd/api
          node --test scripts/scale-budget.test.mjs
          docker run --rm -v "$PWD/deploy/scaling/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" haproxy:3.0-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: Build production image
        run: docker build --progress=plain --file ${{ matrix.dockerfile }} --tag across-backend:ci .
