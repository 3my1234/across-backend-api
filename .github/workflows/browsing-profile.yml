name: Disposable browsing query comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build disposable tools and profile unchanged browsing queries
        env:
          BROWSING_PROFILE: 'true'
        run: |
          npm install --prefix /tmp/singlehost-tools --ignore-scripts --no-audit --no-fund yaml@2.9.0
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          docker build -f deploy/capacity-lab/Dockerfile -t atlxpres-singlehost-rehearsal:local .
          docker pull postgres:16-alpine
          docker pull redis:7.2-alpine
          docker pull haproxy:3.0-alpine
          docker pull grafana/k6:2.3.0
          export NODE_PATH=/tmp/singlehost-tools/node_modules
          sudo --preserve-env=GITHUB_ACTIONS,NODE_PATH,BROWSING_PROFILE python3 deploy/singlehost-lab/rehearse.py --foundation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browsing-profile-${{ github.run_id }}
          path: singlehost-rehearsal-evidence/
          retention-days: 7
