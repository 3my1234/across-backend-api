name: One account customer and provider permissions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dual-role-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-dual-role-ci
          POSTGRES_DB: dual_role_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-dual-role-ci@127.0.0.1:5432/dual_role_tests?sslmode=disable
      SETTLEMENT_TEST_LOCAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Verify real PostgreSQL ownership, eligibility, messages and identity continuity
        run: go test -race -p 1 -count=1 -v ./internal/controllers -run '^Test(Community|TownHall|ReferralGoogleAccountContinuity|ReferralAttribution)'
      - name: Compile API and worker with existing schema
        run: go test -p 1 ./internal/routes ./cmd/api ./cmd/worker -run '^$'
