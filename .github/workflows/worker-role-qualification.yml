name: Worker role isolation qualification
on:
  pull_request:
    branches: [main, feat/milestone-1-foundation]
  workflow_dispatch:
    inputs:
      diagnostic:
        type: choice
        options: [roles, townhall-lock]
        default: roles
permissions:
  contents: read
jobs:
  selected-consumers:
    if: github.event.inputs.diagnostic != 'townhall-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Validate selected roles, startup and heartbeat isolation
        run: |
          go test -p 1 -count=1 ./...
          go test -race -count=1 ./internal/config ./internal/workers ./cmd/worker
      - name: Build the actual worker image without publishing
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f Dockerfile.worker -t atl-worker-role-ci .
  townhall-lock:
    if: github.event.inputs.diagnostic == 'townhall-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: disposable-lock-profile, POSTGRES_DB: lock_profile}
        ports: ['5432:5432']
        options: --cpus 2 --memory 3g --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:disposable-lock-profile@127.0.0.1:5432/lock_profile?sslmode=disable
      SETTLEMENT_TEST_LOCAL: 'true'
      TOWN_HALL_LOCK_PROFILE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.4'}
      - name: Match room-lock plans on 100050 synthetic rooms
        run: |
          set -o pipefail
          mkdir -p lock-evidence
          git rev-parse HEAD >lock-evidence/source.txt
          go test -count=1 -v ./internal/controllers -run '^TestTownHallLockMatchedProfile$' | tee lock-evidence/plans.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: townhall-lock-${{ github.run_id }}
          path: lock-evidence/
          retention-days: 14
