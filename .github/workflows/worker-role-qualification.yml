name: Worker role isolation qualification
on:
  pull_request:
    branches: [main, feat/milestone-1-foundation]
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [roles, receipts, expanded, inbox, system, queries, generator, generator-sustained, generator-memory]
        default: roles
permissions:
  contents: read
jobs:
  generator:
    if: github.event.inputs.phase == 'generator' || github.event.inputs.phase == 'generator-sustained' || github.event.inputs.phase == 'generator-memory'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.inputs.phase == 'generator-sustained' && 50 || 20 }}
    env:
      LAB_EXCHANGE_DIR: ${{ github.workspace }}/generator-exchange
      LAB_GENERATOR_SUITE_DIR: ${{ github.workspace }}/deploy/session-lab
      LAB_INVESTIGATION_PHASE: system
      GENERATOR_SESSION_PROFILE: ${{ github.event.inputs.phase == 'generator-sustained' && 'sustained' || 'stage' }}
      GENERATOR_MEMORY_DIAGNOSTIC: ${{ github.event.inputs.phase == 'generator-memory' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Verify unchanged actions, synthetic target and generator gates
        run: |
          git diff --exit-code 620ac93 -- deploy/session-lab internal/ migrations/ cmd/api/
          go test -race ./deploy/generator-lab
          python3 -m unittest discover -s deploy/generator-lab -p 'test_*.py'
          python3 deploy/generator-lab/verify_source.py
          CGO_ENABLED=0 go build -o deploy/generator-lab/generator-target ./deploy/generator-lab
          docker build -t atlxpres-generator-target:local deploy/generator-lab
          docker compose -f deploy/generator-lab/compose.yml pull sessions
      - name: Qualify original actions with explicit local preparation at two CPUs
        run: bash deploy/generator-lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generator-headroom-${{ github.run_id }}
          path: generator-evidence/
          retention-days: 14
      - name: Remove disposable generator network and target
        if: always()
        run: docker compose -f deploy/generator-lab/compose.yml down --volumes --remove-orphans
  query-diagnostic:
    if: github.event.inputs.phase == 'queries'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAB_INVESTIGATION_PHASE: system
      LAB_SCENARIO: large-busy
      LAB_ACTOR_PAIRS: '500'
      LAB_DB_CPUS: '2'
      LAB_SESSION_TARGET: '500'
      LAB_SESSION_PROFILE: stage
      LAB_SESSION_AUTH_MODE: established
      LAB_SESSION_APPROVAL: /exchange/approval.json
      LAB_GENERATOR_MEMORY: 2g
      LAB_EXPANDED_JOURNEYS: '1'
      LAB_NOTIFICATION_WORKERS: '0'
      LAB_EXCHANGE_DIR: ${{ github.workspace }}/session-exchange
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Verify unchanged original application and diagnostic safety
        run: |
          git diff --exit-code 19e6b25 -- internal/ migrations/ cmd/api/ deploy/session-lab/policy.mjs
          bash -n deploy/notification-lab/query.sh
          python3 -m py_compile deploy/notification-lab/cgroup_sampler.py
          node --check deploy/session-lab/sessions.js
          node deploy/session-lab/test-policy.mjs
          node deploy/session-lab/test-transport.mjs
          go test -race -p 1 ./cmd/capacity-lab ./internal/middleware ./internal/workers
          python3 - <<'PYMEM'
          from pathlib import Path
          available=int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))*1024
          assert available>=10*1024**3, 'Insufficient existing runner headroom: stop, not an application result'
          PYMEM
      - name: Prepare identical synthetic baseline for all ABBA arms
        run: |
          mkdir -p session-exchange system-evidence
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml pull sessions
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml up -d --build --wait --wait-timeout 480 gateway
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml run --rm --no-deps exporter >session-exchange/fixtures.json
          python3 - <<'PYAPPROVAL'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          data=json.loads(Path('session-exchange/fixtures.json').read_text())
          data.pop('sessions')
          Path('session-exchange/run.json').write_text(json.dumps(data))
          approval={'authorized':True,'environment':'isolated-staging','profile':'stage','max_sessions':500,'max_duration_seconds':180,'spending_cap_usd':0,'approved_at':datetime.now(timezone.utc).isoformat(),'source':'User-approved system-wide500 burst investigation; existing isolated public standard runner; no production, purchases or qualification claim'}
          Path('session-exchange/approval.json').write_text(json.dumps(approval))
          PYAPPROVAL
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml run --rm --no-deps exporter /app/lab notification-prepare
          docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements; ANALYZE;'
      - name: Independent actual-query plans and bounded throughput
        run: bash deploy/notification-lab/query.sh
      - name: Retain exact query diagnostic source
        if: always()
        run: |
          mkdir -p query-evidence
          cp cmd/capacity-lab/query_diagnostic.go deploy/notification-lab/query.sh deploy/notification-lab/query-compose.yml query-evidence/
      - name: Preserve collection provenance and failure evidence
        if: always()
        run: |
          mkdir -p system-evidence
          git rev-parse HEAD >system-evidence/source.txt
          cp .github/workflows/worker-role-qualification.yml system-evidence/workflow.yml
          cp deploy/notification-lab/{system.sh,system-compose.yml,cgroup_sampler.py} system-evidence/
          cp deploy/session-lab/{sessions.js,policy.mjs,compose.yml} system-evidence/
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml logs --no-color >system-evidence/final-services.log
          sudo chown -R "$(id -u):$(id -g)" system-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-diagnostic-${{ github.run_id }}
          path: |
            system-evidence/
            query-evidence/
          retention-days: 14
      - name: Remove only isolated disposable lab
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml down --volumes --remove-orphans
  system-burst:
    if: github.event.inputs.phase == 'system'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LAB_INVESTIGATION_PHASE: system
      LAB_SCENARIO: large-busy
      LAB_ACTOR_PAIRS: '500'
      LAB_DB_CPUS: '2'
      LAB_SESSION_TARGET: '500'
      LAB_SESSION_PROFILE: stage
      LAB_SESSION_AUTH_MODE: established
      LAB_SESSION_APPROVAL: /exchange/approval.json
      LAB_GENERATOR_MEMORY: 2g
      LAB_EXPANDED_JOURNEYS: '1'
      LAB_NOTIFICATION_WORKERS: '0'
      LAB_EXCHANGE_DIR: ${{ github.workspace }}/session-exchange
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Verify unchanged original application and diagnostic safety
        run: |
          git diff --exit-code 19e6b25 -- internal/ migrations/ cmd/api/ deploy/session-lab/policy.mjs
          bash -n deploy/notification-lab/system.sh
          python3 -m py_compile deploy/notification-lab/cgroup_sampler.py
          node --check deploy/session-lab/sessions.js
          node deploy/session-lab/test-policy.mjs
          node deploy/session-lab/test-transport.mjs
          go test -race -p 1 ./cmd/capacity-lab ./internal/middleware ./internal/workers
          python3 - <<'PYMEM'
          from pathlib import Path
          available=int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))*1024
          assert available>=10*1024**3, 'Insufficient existing runner headroom: stop, not an application result'
          PYMEM
      - name: Prepare identical synthetic baseline for all ABBA arms
        run: |
          mkdir -p session-exchange system-evidence
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml pull sessions
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml up -d --build --wait --wait-timeout 480 gateway
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml run --rm --no-deps exporter >session-exchange/fixtures.json
          python3 - <<'PYAPPROVAL'
          import json
          from pathlib import Path
          from datetime import datetime,timezone
          data=json.loads(Path('session-exchange/fixtures.json').read_text())
          data.pop('sessions')
          Path('session-exchange/run.json').write_text(json.dumps(data))
          approval={'authorized':True,'environment':'isolated-staging','profile':'stage','max_sessions':500,'max_duration_seconds':180,'spending_cap_usd':0,'approved_at':datetime.now(timezone.utc).isoformat(),'source':'User-approved system-wide500 burst investigation; existing isolated public standard runner; no production, purchases or qualification claim'}
          Path('session-exchange/approval.json').write_text(json.dumps(approval))
          PYAPPROVAL
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml run --rm --no-deps exporter /app/lab notification-prepare
          docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements; ANALYZE;'
      - name: Diagnose worker-off/on/on/off at same500 burst
        run: bash deploy/notification-lab/system.sh
      - name: Preserve collection provenance and failure evidence
        if: always()
        run: |
          mkdir -p system-evidence
          git rev-parse HEAD >system-evidence/source.txt
          cp .github/workflows/worker-role-qualification.yml system-evidence/workflow.yml
          cp deploy/notification-lab/{system.sh,system-compose.yml,cgroup_sampler.py} system-evidence/
          cp deploy/session-lab/{sessions.js,policy.mjs,compose.yml} system-evidence/
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml logs --no-color >system-evidence/final-services.log
          sudo chown -R "$(id -u):$(id -g)" system-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-burst-${{ github.run_id }}
          path: system-evidence/
          retention-days: 14
      - name: Remove only isolated disposable lab
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml -f deploy/notification-lab/system-compose.yml down --volumes --remove-orphans
  selected-consumers:
    if: github.event.inputs.phase == 'roles' || github.event.inputs.phase == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Validate selected roles, startup and heartbeat isolation
        run: |
          go test -p 1 -count=1 ./...
          go test -race -count=1 ./internal/config ./internal/workers ./cmd/worker
      - name: Build the actual worker image without publishing
        run: docker build --build-arg SOURCE_COMMIT=${{ github.sha }} -f Dockerfile.worker -t atl-worker-role-ci .

  receipt-regressions:
    if: github.event.inputs.phase == 'receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-receipt-ci
          POSTGRES_DB: receipt_tests
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-receipt-ci@127.0.0.1:5432/receipt_tests?sslmode=disable
      RECEIPT_TEST_LOCAL: 'true'
      SETTLEMENT_TEST_LOCAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Real PostgreSQL claim, pacing, crash, retry and send regressions
        run: |
          set -o pipefail
          mkdir -p receipt-evidence
          git rev-parse HEAD > receipt-evidence/source.txt
          go test -race -p 1 -count=1 -v ./internal/services -run '^TestReceipt' | tee receipt-evidence/receipt-tests.log
          go test -p 1 -count=1 -v ./internal/controllers -run '^TestRegisteredDevicesReceiveRealSupportPush$' | tee receipt-evidence/send-regression.log
          go test -p 1 -count=1 ./internal/workers ./internal/config ./cmd/worker ./cmd/capacity-lab | tee receipt-evidence/worker-tests.log
      - name: Verify additive migration and compile both entrypoints
        run: |
          go run ./cmd/migrate
          go build -o /tmp/atl-api ./cmd/api
          go build -o /tmp/atl-worker ./cmd/worker
          sha256sum /tmp/atl-api /tmp/atl-worker > receipt-evidence/binaries.sha256
      - name: Matched historical-versus-candidate receipt policy comparison
        env:
          RECEIPT_POLICY_COMPARE: 'true'
        run: |
          set -o pipefail
          go test -p 1 -count=1 -v ./internal/services -run '^TestReceiptMatchedPolicyComparison$' | tee receipt-evidence/policy-comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-qualification-${{ github.run_id }}
          path: receipt-evidence/
          retention-days: 14

  expanded-regressions:
    if: github.event.inputs.phase == 'expanded'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-expanded-ci, POSTGRES_DB: expanded_tests}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CAPACITY_LAB_TEST_DB: postgres://postgres:isolated-expanded-ci@127.0.0.1:5432/expanded_tests?sslmode=disable
      CAPACITY_LAB_TEST_EXPANDED: 'true'
      LAB_SCENARIO: busy
      LAB_ACTOR_PAIRS: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Validate synthetic transport assertions and unchanged policies
        run: |
          node --check deploy/session-lab/sessions.js
          node deploy/session-lab/test-transport.mjs
          node deploy/session-lab/test-policy.mjs
      - name: Verify real migrated fixture eligibility and reconciliation regressions
        run: |
          set -o pipefail
          mkdir -p expanded-evidence
          git rev-parse HEAD > expanded-evidence/source.txt
          go test -race -p 1 -count=1 -v ./cmd/capacity-lab | tee expanded-evidence/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expanded-regressions-${{ github.run_id }}
          path: expanded-evidence/
          retention-days: 14

  inbox-regressions:
    if: github.event.inputs.phase == 'inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: isolated-inbox-ci, POSTGRES_DB: inbox_tests}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-inbox-ci@127.0.0.1:5432/inbox_tests?sslmode=disable
      SETTLEMENT_TEST_LOCAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Differential inbox contract, actual SQL plans and grouped history regressions
        run: |
          set -o pipefail
          mkdir -p inbox-evidence
          git rev-parse HEAD > inbox-evidence/source.txt
          go test -race -p 1 -count=1 -v ./internal/controllers -run '^Test(InboxBoundedPageMatchesLegacyAndPlans|CommunityInboxPreviewIsPrivate|ProductChatGroupedHistoryMigrationAndReceipts)$' | tee inbox-evidence/tests.log
      - name: Compile actual API
        run: go build -o /tmp/atl-inbox-api ./cmd/api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-regressions-${{ github.run_id }}
          path: inbox-evidence/
          retention-days: 14
