name: Play billing verification contracts
on:
  pull_request:
    branches: [main, feat/worker-role-isolation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Verify Google credential and receipt boundaries using synthetic transports
        run: go test -race ./internal/playbilling
      - name: Reachable dependency vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./internal/playbilling
