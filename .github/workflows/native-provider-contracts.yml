name: Native provider contracts
on:
  pull_request:
    branches: [main, feat/milestone-1-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: native_contracts
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/native_contracts?sslmode=disable
      SETTLEMENT_TEST_LOCAL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Verify private detail ownership and complete editable snapshot
        run: |
          go test -p 1 -count=1 -v ./internal/controllers -run '^Test(Native(ListingDetail|RequestExact|PushStatus)|CatalogIgnoredPaginationAndSearchPreserveResponse|CatalogMarketEligibilityAndDeliverySpecificity|CatalogComparePricesIncludeRegularDiscountsAndDelivery)'
          go test -race -p 1 -count=1 -v ./internal/controllers -run '^TestDriver(Safety|DocumentStorage)'
          go test -race -count=1 ./internal/middleware -run '^Test(IgnoredCatalogueParametersShareOneConcurrentFill|ApprovalInvalidatesCachedPriceForEveryRefreshVariant|PublicCache|SimultaneousPublicCache|RefreshNonces)'
      - name: Compile all handlers and route registrations
        run: go test -p 1 ./internal/controllers ./internal/routes -run '^$'
