name: Isolated session qualification
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Smoke4 or launch-authorized100-session/180s isolated stage; no production targets'
        type: choice
        options: [smoke, stage, gradual, qualification-stage, qualification-sustained, login-bursts, signup-bursts]
        default: smoke
  pull_request:
    branches: [main]
    paths: ['cmd/capacity-lab/**', 'deploy/session-lab/**', 'deploy/capacity-lab/**', '.github/workflows/session-lab.yml']
permissions:
  contents: read
jobs:
  smoke:
    if: ${{ inputs.profile != 'qualification-stage' && inputs.profile != 'qualification-sustained' && inputs.profile != 'login-bursts' && inputs.profile != 'signup-bursts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAB_SCENARIO: busy
      LAB_ACTOR_PAIRS: ${{ inputs.profile != 'smoke' && inputs.profile != '' && '100' || '10' }}
      LAB_SESSION_PROFILE: ${{ inputs.profile || 'smoke' }}
      LAB_SESSION_TARGET: ${{ inputs.profile != 'smoke' && inputs.profile != '' && '100' || '4' }}
      LAB_SESSION_APPROVAL: ${{ inputs.profile != 'smoke' && inputs.profile != '' && '/exchange/approval.json' || '' }}
      LAB_EXCHANGE_DIR: ${{ github.workspace }}/session-exchange
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Validate safeguards and accounting
        run: |
          node deploy/session-lab/test-policy.mjs
          mkdir -p session-evidence
          go test -v ./cmd/capacity-lab | tee session-evidence/harness-tests.log
      - name: Start isolated application and fixtures
        run: |
          mkdir -p session-exchange session-evidence
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml pull sessions
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml up -d --build --wait --wait-timeout 480 gateway
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps exporter > session-exchange/fixtures.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('session-exchange/fixtures.json').read_text())
          import os
          from datetime import datetime, timezone
          if os.environ['LAB_SESSION_PROFILE'] != 'smoke':
              # Explicit user directive24Oct authorizes bounded isolated load
              # tests. Public-repository standard runner only, no paid resources.
              approval={'authorized':True,'environment':'isolated-staging','profile':os.environ['LAB_SESSION_PROFILE'],'max_sessions':100,'max_duration_seconds':180,'spending_cap_usd':0,'approved_at':datetime.now(timezone.utc).isoformat(),'source':'User final launch integration directive,24October2026; isolated load tests only'}
              Path('session-exchange/approval.json').write_text(json.dumps(approval))
          data.pop('sessions')
          Path('session-exchange/run.json').write_text(json.dumps(data))
          PY
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps lifecycle > session-evidence/lifecycle.jsonl
      - name: Run small HTTP session workload and capture resources
        run: |
          (
            while true; do
              date -u +%FT%TZ
              docker stats --no-stream --format '{{json .}}'
              docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -At -c "SELECT count(*) AS clients,count(*) FILTER(WHERE state='active') AS active,count(*) FILTER(WHERE wait_event_type='Lock') AS locks FROM pg_stat_activity WHERE backend_type='client backend';"
              docker compose -f deploy/capacity-lab/compose.yml exec -T redis redis-cli INFO memory
              docker compose -f deploy/capacity-lab/compose.yml exec -T redis redis-cli INFO stats
              sleep 5
            done
          ) > session-evidence/resources.log 2>&1 &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          set +e
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps sessions > session-evidence/k6.log 2>&1
          result=$?
          set -e
          cp session-evidence/k6.log session-exchange/k6.log
          echo "$result" > session-exchange/k6-exit-code.txt
          exit "$result"
      - name: Reconcile confirmed writes even on failed thresholds
        if: always()
        run: |
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps verifier > session-evidence/reconciliation.jsonl
      - name: Check durable push retry and stale-worker-lease recovery with mock transport
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps queue-check > session-evidence/queue-recovery.jsonl
      - name: Check replica failover and recovery in the disposable lab only
        run: |
          docker compose -f deploy/capacity-lab/compose.yml stop api1
          trap 'docker start atlxpres-capacity-lab-api1-1' EXIT
          # Measure convergence instead of assuming three seconds exceeds the
          # health-check fall count, connect timeout and request retries.
          recovered=false
          consecutive=0
          began=$(date +%s)
          for attempt in $(seq 1 15); do
            if docker compose -f deploy/capacity-lab/compose.yml exec -T api2 curl -fsS --max-time 3 -D - http://gateway:8080/api/v1/ready > session-evidence/failover-attempt.log; then
              grep -qi 'x-lab-backend: api2' session-evidence/failover-attempt.log
              cat session-evidence/failover-attempt.log >> session-evidence/failover.log
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -eq 3 ]; then
                echo "Three consecutive survivor responses after $(( $(date +%s) - began )) seconds; attempt $attempt" >> session-evidence/failover.log
                recovered=true
                break
              fi
            else
              consecutive=0
            fi
            sleep 2
          done
          test "$recovered" = true
          # Start exactly the stopped API; Compose start would also rerun seed.
          docker start atlxpres-capacity-lab-api1-1
          sleep 4
          docker compose -f deploy/capacity-lab/compose.yml exec -T api2 curl -fsS http://api1:8080/api/v1/ready >> session-evidence/failover.log
      - name: Collect evidence without fixtures or session tokens
        if: always()
        run: |
          mkdir -p session-evidence
          test ! -f session-exchange/summary.json || cp session-exchange/summary.json session-evidence/
          test ! -f session-exchange/timeseries.json || cp session-exchange/timeseries.json session-evidence/
          docker compose -f deploy/capacity-lab/compose.yml logs --no-color > session-evidence/services.log
          lscpu > session-evidence/generator-cpu.txt
          free -h > session-evidence/generator-memory.txt
          docker version > session-evidence/docker-version.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-${{ inputs.profile || 'smoke' }}-${{ github.run_id }}
          path: session-evidence/
          retention-days: 14
      - name: Remove only disposable lab services and data
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml down --volumes --remove-orphans
  qualification:
    if: ${{ inputs.profile == 'qualification-stage' || inputs.profile == 'qualification-sustained' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAB_SCENARIO: large-busy
      LAB_ACTOR_PAIRS: '100'
      LAB_DB_CPUS: '2'
      LAB_SESSION_PROFILE: ${{ inputs.profile == 'qualification-sustained' && 'sustained' || 'stage' }}
      LAB_SESSION_TARGET: '100'
      LAB_SESSION_AUTH_MODE: established
      LAB_SESSION_APPROVAL: /exchange/approval.json
      LAB_EXCHANGE_DIR: ${{ github.workspace }}/session-exchange
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Check unchanged gates and fixture accounting
        run: |
          node deploy/session-lab/test-policy.mjs
          mkdir -p session-evidence
          go test -v ./cmd/capacity-lab | tee session-evidence/harness-tests.log
      - name: Prepare fixed isolated lab and synthetic sessions
        run: |
          mkdir -p session-exchange session-evidence
          git rev-parse HEAD > session-evidence/source-commit.txt
          git diff a5e94496f90435a2610c3c46592af3d0ea33e055 -- internal/ > session-evidence/runtime-diff.patch
          test ! -s session-evidence/runtime-diff.patch
          cp deploy/session-lab/{policy.mjs,sessions.js,established.mjs,compose.yml} session-evidence/
          cp deploy/capacity-lab/compose.yml session-evidence/base-compose.yml
          cp .github/workflows/session-lab.yml session-evidence/workflow.yml
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml pull sessions
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml up -d --build --wait --wait-timeout 480 gateway
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps exporter > session-exchange/fixtures.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          data=json.loads(Path('session-exchange/fixtures.json').read_text())
          profile=os.environ['LAB_SESSION_PROFILE']
          assert profile in ('stage','sustained')
          approval={'authorized':True,'environment':'isolated-staging','profile':profile,'max_sessions':100,'max_duration_seconds':180 if profile=='stage' else 1800,'spending_cap_usd':0,'approved_at':datetime.now(timezone.utc).isoformat(),'source':'User approval27October2026: isolated100independent sessions on existing resources; stop before500'}
          Path('session-exchange/approval.json').write_text(json.dumps(approval))
          data.pop('sessions')
          Path('session-exchange/run.json').write_text(json.dumps(data))
          PY
          docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -v ON_ERROR_STOP=1 -c 'ANALYZE;'
          docker run --rm --network none atlxpres-capacity-lab:local sha256sum /app/api /app/lab > session-evidence/binaries.sha256
          docker image inspect postgres:16-alpine redis:7.2-alpine haproxy:3.0-alpine grafana/k6:2.3.0 > session-evidence/images.json
          sha256sum session-exchange/fixtures.json > session-evidence/fixture-sha256.txt
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps lifecycle > session-evidence/lifecycle.jsonl
      - name: Measure the 100 independent sessions
        run: bash deploy/session-lab/qualify-100.sh
      - name: Reconcile every acknowledged write even after failure
        if: always()
        run: |
          cp session-exchange/k6.log session-evidence/k6.log
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml run --rm --no-deps verifier > session-evidence/reconciliation.jsonl
      - name: Evaluate software gates without advancing
        run: node deploy/session-lab/advance.mjs session-exchange/summary.json session-evidence/reconciliation.jsonl > session-evidence/gate.json
      - name: Retain only non-secret evidence
        if: always()
        run: |
          test ! -f session-exchange/summary.json || cp session-exchange/summary.json session-evidence/
          test ! -f session-exchange/timeseries.json || cp session-exchange/timeseries.json session-evidence/
          docker compose -f deploy/capacity-lab/compose.yml logs --no-color > session-evidence/services.log
          docker stats --no-stream --format '{{json .}}' > session-evidence/final-stats.jsonl
          docker inspect $(docker compose -f deploy/capacity-lab/compose.yml ps -q) > session-evidence/container-limits.json
          lscpu > session-evidence/runner-cpu.txt
          free -h > session-evidence/runner-memory.txt
          sudo chown -R "$(id -u):$(id -g)" session-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-100-${{ inputs.profile }}-${{ github.run_id }}
          path: session-evidence/
          retention-days: 14
      - name: Remove only the disposable lab
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml down --volumes --remove-orphans
