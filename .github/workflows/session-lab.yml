name: Isolated session qualification
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [compare, faults, receipts, expanded, ramp]
        default: compare
      target:
        type: choice
        options: [500, 1000]
        default: 500
      previous_run:
        description: Passing expanded sustained predecessor required before higher concurrency
        type: string
        required: false
      selection_run:
        description: Passing exact-source thread selection and retry regressions for experimental candidate
        type: string
        required: false
      inbox_run:
        description: Successful inbox differential qualification when testing the inbox candidate
        type: string
        required: false
      expanded_profile:
        type: choice
        options: [stage, sustained]
        default: stage
      pilot_run:
        description: Successful expanded 100-session stage required before expanded sustained
        type: string
        required: false
      fixture_run:
        description: Successful expanded fixture regression run required for expanded phase
        type: string
        required: false
      comparison_run:
        description: Successful four-stage comparison run required for faults
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  worker_investigation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      LAB_SCENARIO: large-busy
      LAB_ACTOR_PAIRS: ${{ github.event.inputs.phase == 'ramp' && github.event.inputs.target || '100' }}
      LAB_DB_CPUS: '2'
      LAB_SESSION_PROFILE: ${{ github.event.inputs.phase == 'expanded' && github.event.inputs.expanded_profile || ((github.event.inputs.phase == 'receipts' || github.event.inputs.phase == 'faults' || github.event.inputs.phase == 'ramp') && 'sustained' || 'stage') }}
      LAB_NOTIFICATION_WORKERS: ${{ github.event.inputs.phase != 'compare' && '1' || '0' }}
      LAB_EXPANDED_JOURNEYS: ${{ (github.event.inputs.phase == 'expanded' || github.event.inputs.phase == 'ramp') && '1' || '0' }}
      INBOX_RUN: ${{ github.event.inputs.inbox_run }}
      PILOT_RUN: ${{ github.event.inputs.pilot_run }}
      FIXTURE_RUN: ${{ github.event.inputs.fixture_run }}
      LAB_INVESTIGATION_PHASE: ${{ github.event.inputs.phase || 'compare' }}
      COMPARISON_RUN: ${{ github.event.inputs.comparison_run }}
      LAB_SESSION_TARGET: ${{ github.event.inputs.phase == 'ramp' && github.event.inputs.target || '100' }}
      LAB_GENERATOR_MEMORY: ${{ github.event.inputs.phase == 'ramp' && (github.event.inputs.target == '1000' && '4g' || '2g') || '512m' }}
      PREVIOUS_RUN: ${{ github.event.inputs.previous_run }}
      SELECTION_RUN: ${{ github.event.inputs.selection_run }}
      LAB_SESSION_AUTH_MODE: established
      LAB_SESSION_APPROVAL: /exchange/approval.json
      LAB_EXCHANGE_DIR: ${{ github.workspace }}/session-exchange
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Check unchanged gates and fixture accounting
        run: |
          bash -n deploy/notification-lab/compare.sh deploy/notification-lab/investigate.sh deploy/notification-lab/faults.sh deploy/notification-lab/ramp.sh deploy/session-lab/qualify-ramp.sh
          node deploy/session-lab/test-policy.mjs
          mkdir -p session-evidence
          go test -v ./cmd/capacity-lab ./internal/workers ./internal/middleware | tee session-evidence/harness-tests.log
      - name: Require passing comparison evidence before fault phase
        if: github.event.inputs.phase == 'faults'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$COMPARISON_RUN" =~ ^[0-9]+$ ]]
          gh run view "$COMPARISON_RUN" --json conclusion,headBranch,headSha > comparison-proof.json
          gh run download "$COMPARISON_RUN" --name "external-ledger-workers-$COMPARISON_RUN" --dir approved-comparison
          python3 deploy/notification-lab/verify-comparison.py
          proof_source=$(python3 -c 'import json;print(json.load(open("comparison-proof.json"))["headSha"])')
          git diff --exit-code "$proof_source" HEAD -- internal/ cmd/capacity-lab/ deploy/session-lab/
      - name: Require passing receipt regressions and matched policy proof
        if: github.event.inputs.phase == 'receipts'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$COMPARISON_RUN" =~ ^[0-9]+$ ]]
          gh run view "$COMPARISON_RUN" --json conclusion,headBranch,headSha,workflowName > receipt-proof.json
          gh run download "$COMPARISON_RUN" --name "receipt-qualification-$COMPARISON_RUN" --dir approved-receipts
          python3 - <<'PYPROOF'
          import json,re
          from pathlib import Path
          p=json.loads(Path('receipt-proof.json').read_text())
          assert p['conclusion']=='success' and p['headBranch']=='perf/receipt-throughput'
          assert p['workflowName']=='Worker role isolation qualification'
          raw=Path('approved-receipts/policy-comparison.log').read_text()
          rows=re.findall(r'RECEIPT_POLICY_RESULT arm=(\d) candidate=(true|false) rows=(\d+)',raw)
          assert rows==[('1','false','200'),('2','true','1000'),('3','true','1000'),('4','false','200')],rows
          PYPROOF
          proof_source=$(python3 -c 'import json;print(json.load(open("receipt-proof.json"))["headSha"])')
          git diff --exit-code "$proof_source" HEAD -- internal/ migrations/ cmd/ deploy/session-lab/
      - name: Require sustained receipt proof and exact expanded fixture regression
        if: github.event.inputs.phase == 'expanded'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$COMPARISON_RUN" =~ ^[0-9]+$ && "$FIXTURE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$COMPARISON_RUN" --json conclusion,headBranch,headSha > expanded-predecessor.json
          gh run download "$COMPARISON_RUN" --name "external-ledger-workers-$COMPARISON_RUN" --dir predecessor
          gh run view "$FIXTURE_RUN" --json conclusion,headBranch,headSha > expanded-fixture-proof.json
          gh run download "$FIXTURE_RUN" --name "expanded-regressions-$FIXTURE_RUN" --dir fixture-proof
          python3 - <<'PYEXP'
          import json
          from pathlib import Path
          p=json.loads(Path('expanded-predecessor.json').read_text())
          f=json.loads(Path('expanded-fixture-proof.json').read_text())
          assert p['conclusion']=='success' and p['headBranch']=='perf/receipt-throughput'
          assert f['conclusion']=='success' and f['headBranch']=='experiment/expanded-session-journeys'
          assert Path('predecessor/session-evidence/receipts-drained.txt').read_text().strip()=='true'
          summary=json.loads(Path('predecessor/session-evidence/summary.json').read_text())
          assert summary['configuration']['target']==100 and summary['configuration']['profile']=='sustained'
          PYEXP
          node deploy/session-lab/advance.mjs predecessor/session-evidence/summary.json predecessor/session-evidence/reconciliation.jsonl
          prior=$(python3 -c 'import json;print(json.load(open("expanded-predecessor.json"))["headSha"])')
          fixture=$(python3 -c 'import json;print(json.load(open("expanded-fixture-proof.json"))["headSha"])')
          if test -n "$INBOX_RUN"; then
            git diff --name-only "$prior" HEAD -- internal/ migrations/ > inbox-runtime-files.txt
            python3 - <<'PYFILES'
          from pathlib import Path
          allowed={'internal/controllers/community_controller.go','internal/controllers/inbox_baseline_test.go','internal/controllers/inbox_page_work_test.go'}
          assert set(Path('inbox-runtime-files.txt').read_text().splitlines()) <= allowed
          PYFILES
          else
            git diff --exit-code "$prior" HEAD -- internal/ migrations/
          fi
          git diff --exit-code "$fixture" HEAD -- cmd/ deploy/session-lab/
          git show "$fixture:.github/workflows/worker-role-qualification.yml" > fixture-workflow-before.yml
          python3 - <<'PYJOB'
          from pathlib import Path
          def job(text): return text.split('  expanded-regressions:',1)[1].split('\n  inbox-regressions:',1)[0].strip()
          assert job(Path('fixture-workflow-before.yml').read_text())==job(Path('.github/workflows/worker-role-qualification.yml').read_text())
          PYJOB
      - name: Require actual inbox differential and query-plan qualification
        if: github.event.inputs.phase == 'expanded' && github.event.inputs.inbox_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$INBOX_RUN" =~ ^[0-9]+$ ]]
          gh run view "$INBOX_RUN" --json conclusion,headBranch,headSha > inbox-proof.json
          gh run download "$INBOX_RUN" --name "inbox-regressions-$INBOX_RUN" --dir approved-inbox
          python3 - <<'PYINBOX'
          import json
          from pathlib import Path
          p=json.loads(Path('inbox-proof.json').read_text())
          assert p['conclusion']=='success' and p['headBranch']=='perf/inbox-page-work'
          log=Path('approved-inbox/tests.log').read_text()
          assert '--- PASS: TestInboxBoundedPageMatchesLegacyAndPlans' in log and 'INBOX_SQL_RESULT' in log
          PYINBOX
          proof=$(python3 -c 'import json;print(json.load(open("inbox-proof.json"))["headSha"])')
          git diff --exit-code "$proof" HEAD -- internal/ migrations/ cmd/ deploy/session-lab/
      - name: Require expanded pilot before sustained expanded activity
        if: github.event.inputs.phase == 'expanded' && github.event.inputs.expanded_profile == 'sustained'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$PILOT_RUN" =~ ^[0-9]+$ ]]
          gh run view "$PILOT_RUN" --json conclusion,headBranch,headSha > expanded-pilot-proof.json
          gh run download "$PILOT_RUN" --name "external-ledger-workers-$PILOT_RUN" --dir approved-pilot
          python3 - <<'PYPILOT'
          import json,os
          from pathlib import Path
          p=json.loads(Path('expanded-pilot-proof.json').read_text())
          s=json.loads(Path('approved-pilot/session-evidence/summary.json').read_text())
          expected='perf/inbox-page-work' if os.environ.get('INBOX_RUN') else 'experiment/expanded-session-journeys'
          assert p['conclusion']=='success' and p['headBranch']==expected
          assert s['expanded_journeys'] is True and s['configuration']['target']==100 and s['configuration']['profile']=='stage'
          PYPILOT
          node deploy/session-lab/advance.mjs approved-pilot/session-evidence/summary.json approved-pilot/session-evidence/reconciliation.jsonl
          prior=$(python3 -c 'import json;print(json.load(open("expanded-pilot-proof.json"))["headSha"])')
          git diff --exit-code "$prior" HEAD -- internal/ migrations/ cmd/ deploy/session-lab/
      - name: Require completed expanded sustained predecessor and unchanged application
        if: github.event.inputs.phase == 'ramp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$LAB_SESSION_TARGET" = 500 || "$LAB_SESSION_TARGET" = 1000 ]]
          [[ "$PREVIOUS_RUN" =~ ^[0-9]+$ ]]
          [[ "$FIXTURE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$PREVIOUS_RUN" --json conclusion,headBranch,headSha > ramp-predecessor.json
          gh run download "$PREVIOUS_RUN" --name "external-ledger-workers-$PREVIOUS_RUN" --dir ramp-predecessor
          python3 - <<'PYRAMP'
          import json,os
          from pathlib import Path
          p=json.loads(Path('ramp-predecessor.json').read_text())
          s=json.loads(Path('ramp-predecessor/session-evidence/summary.json').read_text())
          target=int(os.environ['LAB_SESSION_TARGET']);expected=100 if target==500 else 500
          assert p['conclusion']=='success' and p['headBranch'] in ('perf/inbox-page-work','experiment/expanded-capacity-ramp','perf/thread-write-selection')
          assert s['expanded_journeys'] is True and s['configuration']['target']==expected
          assert s['configuration']['profile']=='sustained' and s['configuration']['seconds']==1800
          assert Path('ramp-predecessor/session-evidence/receipts-drained.txt').read_text().strip()=='true'
          PYRAMP
          node deploy/session-lab/advance.mjs ramp-predecessor/session-evidence/summary.json ramp-predecessor/session-evidence/reconciliation.jsonl > ramp-predecessor-gate.json
          previous=$(python3 -c 'import json;print(json.load(open("ramp-predecessor.json"))["headSha"])')
          git diff --exit-code "$previous" HEAD -- migrations/ cmd/ ':(exclude)cmd/capacity-lab/main.go' ':(exclude)cmd/capacity-lab/main_test.go' deploy/session-lab/sessions.js deploy/session-lab/transport.mjs deploy/session-lab/policy.mjs deploy/session-lab/established.mjs
          if test -n "$SELECTION_RUN"; then
            [[ "$SELECTION_RUN" =~ ^[0-9]+$ ]]
            git diff --name-only "$previous" HEAD -- internal/ > selection-runtime-files.txt
            gh run view "$SELECTION_RUN" --json conclusion,headBranch,headSha > selection-proof.json
            gh run download "$SELECTION_RUN" --name "inbox-regressions-$SELECTION_RUN" --dir selection-proof
            python3 - <<'PYSELECT'
          import json
          from pathlib import Path
          allowed={'internal/controllers/provider_conversation_controller.go','internal/controllers/provider_threads.go','internal/controllers/thread_write_baseline_test.go','internal/controllers/thread_write_selection_test.go'}
          assert set(Path('selection-runtime-files.txt').read_text().splitlines()) <= allowed
          proof=json.loads(Path('selection-proof.json').read_text())
          assert proof['conclusion']=='success' and proof['headBranch']=='perf/thread-write-selection'
          log=Path('selection-proof/tests.log').read_text()
          for test in ('ThreadWriteSelectionBoundedMatchesLegacy','ProductChatGroupedHistoryMigrationAndReceipts','ProductChatMigrationPermissionsAttachmentsAndRetries','CommunityLocationPinsPrivateAndIdempotent','CommunityTownHallAdmissionExpiryAndHandoff'):
              assert '--- PASS: Test'+test in log
          assert 'THREAD_SELECTION_RESULT' in log
          PYSELECT
            selected=$(python3 -c 'import json;print(json.load(open("selection-proof.json"))["headSha"])')
            git diff --exit-code "$selected" HEAD -- internal/ migrations/ cmd/ deploy/session-lab/
          else
            git diff --exit-code "$previous" HEAD -- internal/
          fi
          # Only historical import/reconstructed fixture metadata may differ.
          gh run view "$FIXTURE_RUN" --json conclusion,headBranch,headSha > ramp-fixture-proof.json
          gh run download "$FIXTURE_RUN" --name "expanded-regressions-$FIXTURE_RUN" --dir ramp-fixture
          python3 - <<'PYFIXTURE'
          import json
          from pathlib import Path
          p=json.loads(Path('ramp-fixture-proof.json').read_text())
          assert p['conclusion']=='success' and p['headBranch']=='experiment/expanded-capacity-ramp'
          assert '--- PASS: TestFreshLabMigrationsAndFixtures' in Path('ramp-fixture/tests.log').read_text()
          PYFIXTURE
          fixture=$(python3 -c 'import json;print(json.load(open("ramp-fixture-proof.json"))["headSha"])')
          git diff --exit-code "$fixture" HEAD -- migrations/ cmd/ deploy/session-lab/
          if test -z "$SELECTION_RUN"; then git diff --exit-code "$fixture" HEAD -- internal/; fi
          # Same measurement/recovery body; only allowed-target/profile guards differ.
          python3 - <<'PYBODY'
          from pathlib import Path
          old=Path('deploy/session-lab/qualify-100.sh').read_text().split('# Observer is outside k6;',1)[1]
          new=Path('deploy/session-lab/qualify-ramp.sh').read_text().split('# Observer is outside k6;',1)[1]
          assert old==new
          available=int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))*1024
          assert available>=10*1024**3, 'Existing runner lacks reviewed memory headroom; stop, not an application-capacity result'
          PYBODY
      - name: Prepare fixed isolated lab and synthetic sessions
        run: |
          mkdir -p session-exchange session-evidence
          git rev-parse HEAD > session-evidence/source-commit.txt
          git diff a5e94496f90435a2610c3c46592af3d0ea33e055 -- internal/ > session-evidence/runtime-diff.patch
          if test "$LAB_INVESTIGATION_PHASE" != receipts && test "$LAB_INVESTIGATION_PHASE" != expanded && test "$LAB_INVESTIGATION_PHASE" != ramp; then test ! -s session-evidence/runtime-diff.patch; fi
          cp deploy/session-lab/{policy.mjs,sessions.js,established.mjs,compose.yml} session-evidence/
          cp deploy/capacity-lab/compose.yml session-evidence/base-compose.yml
          cp .github/workflows/session-lab.yml session-evidence/workflow.yml
          cp cmd/capacity-lab/session_observer.go session-evidence/session_observer.go
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml pull sessions
          if ! docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml up -d --build --wait --wait-timeout 480 gateway; then
            docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -At -c "SELECT coalesce(json_agg(s),'[]') FROM(SELECT application_name,state,wait_event_type,wait_event,clock_timestamp()-query_start AS elapsed,left(query,300) AS synthetic_query_prefix FROM pg_stat_activity WHERE application_name='lab-seed')s;" > session-evidence/failed-setup-activity.json || true
            exit 1
          fi
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml run --rm --no-deps exporter > session-exchange/fixtures.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          data=json.loads(Path('session-exchange/fixtures.json').read_text())
          profile=os.environ['LAB_SESSION_PROFILE']
          assert profile in ('stage','sustained')
          approval={'authorized':True,'environment':'isolated-staging','profile':profile,'max_sessions':int(os.environ['LAB_SESSION_TARGET']),'max_duration_seconds':180 if profile=='stage' else 1800,'spending_cap_usd':0,'approved_at':datetime.now(timezone.utc).isoformat(),'source':'User approval: actual notification workers with mocks, existing isolated resources, gated100/500/1000 sessions on existing public standard runner, no production or purchases'}
          Path('session-exchange/approval.json').write_text(json.dumps(approval))
          data.pop('sessions')
          Path('session-exchange/run.json').write_text(json.dumps(data))
          PY
          docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -v ON_ERROR_STOP=1 -c 'ANALYZE;'
          docker run --rm --network none atlxpres-capacity-lab:local sha256sum /app/api /app/lab > session-evidence/binaries.sha256
          docker image inspect postgres:16-alpine redis:7.2-alpine haproxy:3.0-alpine grafana/k6:2.3.0 > session-evidence/images.json
          sha256sum session-exchange/fixtures.json > session-evidence/fixture-sha256.txt
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml run --rm --no-deps lifecycle > session-evidence/lifecycle.jsonl
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml run --rm --no-deps exporter /app/lab notification-prepare
          docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION pg_stat_statements;'
          cp deploy/notification-lab/* session-evidence/
          cp .github/workflows/notification-lab.yml session-evidence/notification-workflow.yml
      - name: Measure the gated independent-session stage
        run: |
          if test "$LAB_INVESTIGATION_PHASE" = ramp; then
            bash deploy/notification-lab/ramp.sh
          elif test "$LAB_INVESTIGATION_PHASE" = expanded; then
            if test "$LAB_SESSION_PROFILE" = sustained; then
              bash deploy/notification-lab/investigate.sh
              bash deploy/notification-lab/receipt-tail.sh
            else
              bash deploy/notification-lab/expanded-pilot.sh
            fi
          elif test "$LAB_INVESTIGATION_PHASE" = receipts; then
            bash deploy/notification-lab/investigate.sh
            bash deploy/notification-lab/receipt-tail.sh
          elif test "$LAB_INVESTIGATION_PHASE" = faults; then
            cmp session-evidence/binaries.sha256 approved-comparison/comparison-evidence/binaries.sha256
            bash deploy/notification-lab/investigate.sh
          else
            bash deploy/notification-lab/compare.sh
          fi
      - name: Reconcile fault workload even after abort
        if: always() && github.event.inputs.phase != 'compare'
        run: |
          test ! -f session-exchange/k6.log || cp session-exchange/k6.log session-evidence/k6.log
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml run --rm --no-deps verifier > session-evidence/reconciliation.jsonl
      - name: Check fault workload software gates
        if: github.event.inputs.phase != 'compare'
        run: node deploy/session-lab/advance.mjs session-exchange/summary.json session-evidence/reconciliation.jsonl > session-evidence/gate.json
      - name: Retain only non-secret evidence
        if: always()
        run: |
          test ! -f session-exchange/summary.json || cp session-exchange/summary.json session-evidence/
          test ! -f session-exchange/timeseries.json || cp session-exchange/timeseries.json session-evidence/
          docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml logs --no-color > session-evidence/services.log
          docker stats --no-stream --format '{{json .}}' > session-evidence/final-stats.jsonl
          docker inspect $(docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml ps -q) > session-evidence/container-limits.json
          lscpu > session-evidence/runner-cpu.txt
          free -h > session-evidence/runner-memory.txt
          mkdir -p comparison-evidence
          sudo chown -R "$(id -u):$(id -g)" session-evidence comparison-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-ledger-workers-${{ github.run_id }}
          path: |
            session-evidence/
            comparison-evidence/
          retention-days: 14
      - name: Remove only the disposable lab
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/session-lab/compose.yml -f deploy/notification-lab/compose.yml down --volumes --remove-orphans
