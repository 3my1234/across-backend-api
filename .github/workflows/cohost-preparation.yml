name: Cohost preparation safety checks
run-name: ${{ inputs.execute && format('Cohost trial {0}', inputs.run_nonce) || 'Cohost offline safety' }}
on:
  push:
    branches: [experiment/launch-qualification]
    paths: [deploy/cohost-lab/**, .github/workflows/cohost-preparation.yml]
  workflow_dispatch:
    inputs:
      execute:
        description: "FALSE is offline-only. TRUE requires separately approved live cohost trial."
        type: boolean
        default: false
      run_nonce:
        description: "Exact separately approved cohost nonce"
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  offline-and-disposable-safety:
    if: ${{ !inputs.execute }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Offline renderer and safety policy
        run: |
          npm install --prefix /tmp/cohost-tools --ignore-scripts --no-audit --no-fund yaml@2.9.0
          NODE_PATH=/tmp/cohost-tools/node_modules node deploy/cohost-lab/test-render.cjs
          python3 -m unittest discover -s deploy/cohost-lab -p 'test_*.py' -v
          python3 -m py_compile deploy/cohost-lab/safety.py deploy/cohost-lab/watchdog.py
          node deploy/cohost-lab/test-stage-gate.mjs
          python3 deploy/cohost-lab/trial_runner.py --plan
      - name: Validate stop ownership in disposable CI only
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,tempfile
          run='cohost-'+'b'*16
          def call(*args): return subprocess.check_output(args,text=True).strip()
          owned=call('docker','run','-d','--network','none','--label','atlxpres.cohost.run='+run,'alpine:3.23','sleep','300')
          sentinel=call('docker','run','-d','--network','none','--label','atlxpres.cohost.run=unrelated-ci-sentinel','alpine:3.23','sleep','300')
          try:
              with tempfile.TemporaryDirectory() as temp:
                  base=pathlib.Path(temp);manifest=base/'manifest.json';sample=base/'sample.json'
                  sample.write_text('{}')
                  def invoke(ids):
                      manifest.write_text(json.dumps(dict(run=run,role='main',container_ids=ids)))
                      call('sudo','chown','root:root',str(manifest))
                      result=subprocess.run(['sudo','python3','deploy/cohost-lab/safety.py',str(manifest),str(sample),'--stop-test'])
                      call('sudo','chown',str(__import__('os').getuid()),str(manifest))
                      return result.returncode
                  assert invoke([sentinel]) != 0
                  assert call('docker','inspect','-f','{{.State.Running}}',sentinel)=='true'
                  assert invoke([owned]) == 2
                  assert call('docker','inspect','-f','{{.State.Running}}',owned)=='false'
                  assert call('docker','inspect','-f','{{.State.Running}}',sentinel)=='true'
          finally:
              subprocess.run(['docker','rm','-f',owned,sentinel],check=True)
          PY
      - name: Verify exact archive identities through disposable Docker save and load
        run: python3 deploy/cohost-lab/integration_image_identity.py
      - name: Exercise watchdog stop paths with simulated sensors and real disposable containers
        run: sudo --preserve-env=GITHUB_ACTIONS python3 deploy/cohost-lab/integration_watchdog.py
      - name: Prove exact-owned cleanup and refusal of unrelated data
        run: sudo --preserve-env=GITHUB_ACTIONS python3 deploy/cohost-lab/integration_cleanup.py
      - name: Install disposable CI transport test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server postgresql-client
      - name: Prove restricted SSH Unix socket reaches only the disposable PostgreSQL
        run: sudo --preserve-env=GITHUB_ACTIONS python3 deploy/cohost-lab/integration_ssh.py
      - name: Build immutable test image bundle on free CI only
        if: contains(github.event.head_commit.message, '[bundle]')
        run: |
          mkdir -p cohost-bundle
          docker build -f deploy/capacity-lab/Dockerfile -t atlxpres-cohost-app:review .
          docker pull redis:7.2-alpine
          docker pull haproxy:3.0-alpine
          docker pull alpine/socat
          python3 - <<'PY'
          import json,subprocess,pathlib
          tags=dict(app='atlxpres-cohost-app:review',postgres='postgres:16-alpine',redis='redis:7.2-alpine',gateway='haproxy:3.0-alpine',socat='alpine/socat:latest')
          images={k:subprocess.check_output(['docker','image','inspect','-f','{{.Id}}',v],text=True).strip() for k,v in tags.items()}
          pathlib.Path('cohost-bundle/images.json').write_text(json.dumps(dict(images=images,source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()),indent=2))
          subprocess.run(['docker','save','-o','cohost-bundle/images.tar',*tags.values()],check=True)
          PY
          cat cohost-bundle/images.json
          cp -R deploy/cohost-lab cohost-bundle/tools
          cp deploy/capacity-lab/haproxy.cfg cohost-bundle/
          gzip -1 cohost-bundle/images.tar
          sha256sum cohost-bundle/images.tar.gz cohost-bundle/images.json > cohost-bundle/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[bundle]')
        with:
          name: cohost-reviewed-image-bundle
          path: cohost-bundle/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: contains(github.event.head_commit.message, '[bundle]')
        with:
          name: cohost-reviewed-image-metadata
          path: |
            cohost-bundle/images.json
            cohost-bundle/SHA256SUMS
          retention-days: 3
  qualification:
    if: ${{ inputs.execute }}
    concurrency:
      group: existing-vps-cohost-trial
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Retain and verify existing successful long-generator proof
        if: inputs.execute
        env:
          GH_TOKEN: ${{ github.token }}
          COHOST_TRIAL_BUNDLE: ${{ secrets.COHOST_TRIAL_BUNDLE }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          approval=json.loads(os.environ['COHOST_TRIAL_BUNDLE'])['approval']
          run=str(approval['safety_run'])
          assert run.isdigit()
          proof=json.loads(subprocess.check_output(['gh','run','view',run,'--json','conclusion,status,headSha']))
          assert proof['status']=='completed' and proof['conclusion']=='success'
          assert proof['headSha']==approval['source_commit']
          PY
          gh run view 40866958782 --json conclusion,status > /tmp/long-generator-run.json
          python3 -c "import json; d=json.load(open('/tmp/long-generator-run.json')); assert d['status']=='completed' and d['conclusion']=='success'"
          gh run download 40866958782 --name generator-headroom-40866958782 --dir /tmp/generator-proof
          python3 deploy/cohost-lab/check_generator.py /tmp/generator-proof
          docker pull grafana/k6:2.3.0
      - name: Install temporary operator-approved restricted access
        if: inputs.execute
        env:
          COHOST_TRIAL_BUNDLE: ${{ secrets.COHOST_TRIAL_BUNDLE }}
          EXPECTED_NONCE: ${{ inputs.run_nonce }}
        run: |
          python3 - <<'PY'
          import json,os,re
          d=json.loads(os.environ['COHOST_TRIAL_BUNDLE'])
          assert re.fullmatch('cohost-[a-f0-9]{16}',os.environ['EXPECTED_NONCE'])
          assert d['approval']['run']==os.environ['EXPECTED_NONCE']
          PY
          python3 deploy/cohost-lab/install_ci_bundle.py .cohost-private
      - name: Execute staged trial ONLY after explicit live authorization
        if: inputs.execute
        run: python3 deploy/cohost-lab/trial_runner.py --execute --approval .cohost-private/approval.json --ssh-config .cohost-private/ssh_config --output cohost-evidence
      - name: Preserve public evidence even after abort
        if: always() && inputs.execute
        uses: actions/upload-artifact@v4
        with:
          name: cohost-trial-${{ github.run_id }}
          path: cohost-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove runner-local temporary credentials and synthetic bearer fixtures
        if: always()
        run: |
          python3 deploy/cohost-lab/install_ci_bundle.py --cleanup .cohost-private
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path.cwd().resolve()
          for p in [root/'.cohost-private',*root.glob('private-cohost-*')]:
              assert p.parent==root
              if p.exists():shutil.rmtree(p)
          PY
