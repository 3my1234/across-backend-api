# Matched inline/async notification arms; original 100-session workload unchanged.
name: Durable fanout matched 100-session checkpoint
on:
  push:
    branches: [verify/durable-fanout-mixed]
    paths: [.github/workflows/launch-mixed-checkpoint.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: disposable-fanout-100-checkpoint
  cancel-in-progress: false
jobs:
  mixed:
    strategy:
      fail-fast: false
      matrix:
        mode: [async]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MESSAGE_FANOUT_REPLAY: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Check original workload and source integrity
        run: |
          npm install --prefix /tmp/singlehost-tools --ignore-scripts --no-audit --no-fund yaml@2.9.0
          NODE_PATH=/tmp/singlehost-tools/node_modules node deploy/singlehost-lab/test-render.cjs
          node deploy/session-lab/test-policy.mjs
          python3 -m py_compile deploy/singlehost-lab/*.py
          python3 -m unittest discover -s deploy/singlehost-lab -p test_message_fanout_replay.py -v
          python3 deploy/singlehost-lab/provenance.py
          python3 deploy/singlehost-lab/check_seed.py
      - name: Build disposable tools and verify current release prerequisites
        run: |
          docker build -f deploy/capacity-lab/Dockerfile -t atlxpres-singlehost-rehearsal:local .
          docker pull postgres:16-alpine
          docker pull redis:7.2-alpine
          docker pull haproxy:3.0-alpine
          docker pull grafana/k6:2.3.0
      - name: Run full-fixture mixed 100-session 180-second checkpoint
        run: |
          export NODE_PATH=/tmp/singlehost-tools/node_modules
          sudo --preserve-env=GITHUB_ACTIONS,NODE_PATH,MESSAGE_FANOUT_REPLAY python3 deploy/singlehost-lab/rehearse.py --launch-checkpoint --checkpoint-sessions 100
      - name: Print bounded results even after failed acceptance gates
        if: always()
        run: |
          for f in result.json k6.log reconciliation.jsonl message-fanout-ledger.json; do
            if [ -f "singlehost-rehearsal-evidence/$f" ]; then tail -n 45 "singlehost-rehearsal-evidence/$f"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanout-100-${{ matrix.mode }}-${{ github.run_id }}
          path: singlehost-rehearsal-evidence/
          retention-days: 7
