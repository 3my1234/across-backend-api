name: Publish immutable AWS API image
on:
  workflow_dispatch:
    inputs:
      region:
        description: Approved AWS region
        required: true
      role_arn:
        description: Foundation BuildRoleArn (GitHub OIDC; no access keys)
        required: true
      repository_uri:
        description: Foundation ImageRepository output
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.role_arn }}
          aws-region: ${{ inputs.region }}
          role-session-name: atl-image-build
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push selected main commit
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.repository_uri }}:${{ github.sha }}
          provenance: false
      - name: Record immutable deployment image
        env:
          REPOSITORY_URI: ${{ inputs.repository_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: printf 'Deployment image: `%s@%s`\n' "$REPOSITORY_URI" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
