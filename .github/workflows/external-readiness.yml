name: External API readiness
on:
  schedule:
    # Offset from the top of the hour. GitHub schedules are best-effort, not an SLA.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public readiness from outside both VPSs
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          passed=False
          for attempt in range(3):
              try:
                  with urllib.request.urlopen('https://api.atlxpres.com/api/v1/ready',timeout=10) as response:
                      passed=response.status==200 and json.load(response).get('ok') is True
                  if passed:break
              except Exception:pass
              if attempt<2:time.sleep(5)
          if not passed:raise SystemExit('ATL public readiness failed from an external runner. Inspect the VPS monitors and gateway; do not restart or scale automatically.')
          print('ATL public readiness passed. No load, database mutation, notification or deployment performed.')
          PY
