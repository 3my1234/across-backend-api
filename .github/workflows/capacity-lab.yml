name: Isolated capacity lab
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Smoke, sustained baseline or independently paced burst/recovery; isolated only
        type: choice
        options: [smoke, baseline, burst, comparison]
        default: smoke
      scenario:
        description: Dataset growth and busy Town Hall contention
        type: choice
        options: [standard, busy, large, large-busy]
        default: standard
      database_cpus:
        description: Disposable lab database CPU ceiling; API limits stay unchanged
        type: choice
        options: ['1', '2']
        default: '1'
  pull_request:
    branches: [main]
    paths: ['cmd/capacity-lab/**', 'deploy/capacity-lab/**', 'migrations/**', '.github/workflows/capacity-lab.yml']
permissions:
  contents: read
jobs:
  lab:
    if: ${{ inputs.profile != 'comparison' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAB_PROFILE: ${{ inputs.profile || 'smoke' }}
      LAB_SCENARIO: ${{ inputs.scenario || 'standard' }}
      LAB_DB_CPUS: ${{ inputs.database_cpus || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Check load runner safety and accounting
        run: go test ./cmd/capacity-lab
      - name: Start disposable database, Redis and real API replicas
        run: docker compose -f deploy/capacity-lab/compose.yml up -d --build --wait --wait-timeout 480 gateway
      - name: Run bounded workload on the internal network
        run: |
          mkdir -p capacity-artifacts
          (
            while true; do
              date -u +%FT%TZ
              docker stats --no-stream --format '{{json .}}'
              docker compose -f deploy/capacity-lab/compose.yml exec -T postgres psql -U lab -d capacity_lab -X -At -c "SELECT count(*) AS clients, count(*) FILTER (WHERE state='active') AS active, count(*) FILTER (WHERE wait_event_type='Lock') AS lock_waiters FROM pg_stat_activity WHERE backend_type='client backend';"
              sleep 5
            done
          ) > capacity-artifacts/resource-samples.log 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true' EXIT
          docker compose -f deploy/capacity-lab/compose.yml run --rm --no-deps runner > capacity-artifacts/results.jsonl
      - name: Collect lab evidence
        if: always()
        run: |
          mkdir -p capacity-artifacts
          docker compose -f deploy/capacity-lab/compose.yml logs --no-color > capacity-artifacts/lab.log
          docker stats --no-stream --format '{{json .}}' > capacity-artifacts/container-stats.jsonl
          lscpu > capacity-artifacts/runner-cpu.txt
          free -h > capacity-artifacts/runner-memory.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-capacity-${{ github.run_id }}
          path: capacity-artifacts/
          retention-days: 14
      - name: Remove disposable lab containers and data
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml down --volumes --remove-orphans
  comparison:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.profile == 'comparison' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LAB_SCENARIO: large-busy
      LAB_DB_CPUS: '2'
      LAB_ACTOR_PAIRS: '100'
      LAB_COMPARISON: 'true'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.27.3'}
      - name: Check observer and request accounting
        run: go test ./cmd/capacity-lab
      - name: Run matched original-optimized-optimized-original experiment
        run: bash deploy/capacity-lab/compare-history.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-mixed-comparison-${{ github.run_id }}
          path: capacity-comparison/
          retention-days: 14
      - name: Remove only the disposable comparison lab
        if: always()
        run: docker compose -f deploy/capacity-lab/compose.yml -f deploy/capacity-lab/comparison-compose.yml down --volumes --remove-orphans
